dns:
  listen: "100.114.154.34:5300"
  proxy_ip: "100.114.154.34"
  passthrough:
    - "*.tailscale.com"
    - "*.tailscale.io"
    - "*.ts.net"

proxy:
  http_listen: "100.114.154.34:8080"
  https_listen: "100.114.154.34:8443"
  tunnel_listen: "100.114.154.34:3128" 

tls:
  mode: mitm
  ca_cert: "/Users/georges-studio/.local/share/iron-proxy/iron-ca.crt"
  ca_key: "/Users/georges-studio/.local/share/iron-proxy/iron-ca.key"

transforms:
  - name: secrets
    config:
      secrets:
        - source:
            type: env
            var: GITHUB_TOKEN
          replace:
            proxy_value: "__secret_github_token"
            match_headers: ["Authorization"]
          rules:
            - host: "api.github.com"

        - source:
            type: env
            var: OPENROUTER_KEY
          replace:
            proxy_value: "__secret_openrouter_key"
            match_headers: ["Authorization"]
          rules:
            - host: "openrouter.ai"
              paths: ["/api/*"]
