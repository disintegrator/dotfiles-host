[bootstrap.mise_shell_activate]
zsh = true
bash = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.macos.launchd.agents.iron-proxy]
program = "/Users/georges-studio/.local/bin/mise"
args = [
  "-E", "iron",
  "exec", "--",
  "iron-proxy", "-config", "{{ config_root }}/.config/iron-proxy/config.yaml",
]
run_at_load = true
keep_alive = true
throttle_interval = 5
working_directory = "~"
stdout_path = "~/Library/Logs/iron-proxy.log"
stderr_path = "~/Library/Logs/iron-proxy.err.log"

[tools]
gh = "latest"
"github:paradigmxyz/iron-proxy" = "latest"
gum = "latest"
mkcert = "latest"

[dotfiles]
"~/.config/iron-proxy" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
